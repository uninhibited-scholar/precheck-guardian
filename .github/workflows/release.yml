name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — NO API token required.
#
# One-time setup (~2 min, all on the PyPI website, no token to manage):
#   1. Create a PyPI account at https://pypi.org/account/register/ (enable 2FA).
#   2. Go to https://pypi.org/manage/account/publishing/ and add a
#      "pending publisher" with:
#         PyPI project name : precheck-guardian
#         Owner             : uninhibited-scholar
#         Repository name   : precheck-guardian
#         Workflow name     : release.yml
#         Environment name  : pypi
#   3. Then publish any time by tagging a release:
#         git tag v0.1.0 && git push origin v0.1.0
#
# No secrets, no TWINE_PASSWORD, nothing to paste. GitHub proves the workflow's
# identity to PyPI automatically.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
