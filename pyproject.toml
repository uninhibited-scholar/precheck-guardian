[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precheck-guardian"
version = "0.1.0"
description = "A pre-execution approval gate for AI agents: preview the plan, see the risks, approve or reject before anything runs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Frank" }]
keywords = ["ai", "agent", "llm", "approval", "human-in-the-loop", "safety", "guardrails", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
rich = ["rich>=13.0"]
interactive = ["questionary>=1.10"]
langchain = ["langchain-core>=0.3"]  # Python 3.10+
all = ["rich>=13.0", "questionary>=1.10"]
dev = ["pytest>=7.0", "rich>=13.0", "questionary>=1.10"]

[project.urls]
Homepage = "https://github.com/uninhibited-scholar/precheck-guardian"
Issues = "https://github.com/uninhibited-scholar/precheck-guardian/issues"

[project.scripts]
precheck = "approval_hook.__main__:main"

[tool.setuptools.packages.find]
include = ["approval_hook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
