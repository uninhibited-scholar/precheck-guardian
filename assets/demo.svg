<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="SFMono-Regular,Consolas,Menlo,monospace" font-size="14">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .txt { fill: #c9d1d9; }
      .dim { fill: #6e7681; }
      .cyan { fill: #39c5cf; }
      .green { fill: #3fb950; }
      .yellow { fill: #d29922; }
      .red { fill: #f85149; }
      .b { font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="450" rx="10"/>
  <rect class="bar" x="0" y="0" width="760" height="34" rx="10"/>
  <rect class="bar" x="0" y="20" width="760" height="14"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text class="dim" x="380" y="22" text-anchor="middle">precheck-guardian — approval required</text>

  <!-- prompt -->
  <text y="62"><tspan class="green" x="20">$</tspan><tspan class="cyan" x="36"> python</tspan><tspan class="txt"> -m approval_hook</tspan></text>

  <!-- panel -->
  <rect x="20" y="78" width="720" height="56" rx="6" fill="none" stroke="#30363d"/>
  <text class="cyan b" x="34" y="100">Agent Execution Plan</text>
  <text y="100">
    <tspan class="green" x="240">🟢 1</tspan>
    <tspan class="yellow" x="300">🟡 1</tspan>
    <tspan class="red" x="360">🔴 2</tspan>
    <tspan class="txt" x="420">⛔ 2</tspan>
    <tspan class="dim" x="500">⏱ 15s</tspan>
  </text>
  <text class="dim" x="34" y="122">6 steps · max risk CRITICAL · audit: approval_audit.jsonl</text>

  <!-- table header -->
  <text class="dim" y="166">
    <tspan x="24">#</tspan><tspan x="60">RISK</tspan><tspan x="170">ACTION</tspan><tspan x="600">TOOL</tspan>
  </text>
  <line x1="20" y1="176" x2="740" y2="176" stroke="#21262d"/>

  <!-- rows -->
  <text y="200"><tspan class="dim" x="26">1</tspan><tspan class="green b" x="60">LOW</tspan><tspan class="txt" x="170">SELECT * FROM users WHERE status='active'</tspan><tspan class="dim" x="600">sql_query</tspan></text>
  <text y="226"><tspan class="dim" x="26">2</tspan><tspan class="yellow b" x="60">MEDIUM</tspan><tspan class="txt" x="170">Export results to /tmp/active_users.csv</tspan><tspan class="dim" x="600">file_write</tspan></text>

  <text y="252"><tspan class="dim" x="26">3</tspan><tspan class="red b" x="60">HIGH</tspan><tspan class="txt" x="170">UPDATE accounts SET billed = 1 ...</tspan><tspan class="dim" x="600">sql</tspan></text>
  <text class="red" x="170" y="270">⚠ SQL UPDATE modifies existing rows.</text>

  <rect x="56" y="282" width="74" height="20" rx="3" fill="#b62324"/>
  <text y="297"><tspan class="dim" x="26">4</tspan><tspan class="b" x="64" fill="#ffffff">CRITICAL</tspan><tspan class="txt" x="170">DROP TABLE users_staging</tspan><tspan class="dim" x="600">sql_query</tspan></text>
  <text class="red" x="170" y="315">⚠ Dropping a table destroys its data and schema.</text>

  <rect x="56" y="327" width="74" height="20" rx="3" fill="#b62324"/>
  <text y="342"><tspan class="dim" x="26">5</tspan><tspan class="b" x="64" fill="#ffffff">CRITICAL</tspan><tspan class="txt" x="170">rm -rf /tmp/build</tspan><tspan class="dim" x="600">file_delete</tspan></text>
  <text class="red" x="170" y="360">⚠ Recursive forced delete — files cannot be recovered.</text>

  <text y="386"><tspan class="dim" x="26">6</tspan><tspan class="red b" x="60">HIGH</tspan><tspan class="txt" x="170">git push --force origin release</tspan><tspan class="dim" x="600">git</tspan></text>
  <text class="red" x="170" y="404">⚠ Force-push can overwrite remote history.</text>

  <line x1="20" y1="416" x2="740" y2="416" stroke="#21262d"/>
  <text y="438"><tspan class="txt b" x="20">? How do you want to proceed?</tspan><tspan class="green" x="290">✅ Approve</tspan><tspan class="yellow" x="420">✏️ Edit</tspan><tspan class="red" x="520">❌ Reject</tspan></text>
</svg>
